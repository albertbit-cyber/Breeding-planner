import groovy.json.JsonSlurper

def packageJson = new JsonSlurper().parse(file("../package.json"))
def versionParts = (packageJson.version as String).tokenize('.').collect { it.toInteger() }
while (versionParts.size() < 3) { versionParts << 0 }

ext {
    appVersionName = packageJson.version as String
    appVersionCode = versionParts[0] * 1000000 + versionParts[1] * 10000 + versionParts[2]
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}
