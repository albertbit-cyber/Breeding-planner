name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install marketplace dependencies
        run: npm ci
        working-directory: breeding-app-marketplace

      - name: Build marketplace
        env:
          PUBLIC_URL: /${{ github.event.repository.name }}/
          # The build had no VITE_API_URL, so every deploy shipped an app that
          # booted straight into "Backend not configured - running in local
          # mode" and could not list a single animal. Set the repository
          # variable to point somewhere else; this is the fallback.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://breeding-planner-production.up.railway.app/api' }}
        run: npm run build
        working-directory: breeding-app-marketplace

      # GitHub Pages serves 404.html for any path it has no file for, and it is
      # the only SPA fallback Pages offers. Without this, every deep link and
      # every refresh away from the index 404s -- which is most of the point of
      # the marketplace having real URLs.
      - name: Add SPA fallback for deep links
        run: cp build/index.html build/404.html
        working-directory: breeding-app-marketplace

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: breeding-app-marketplace/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
